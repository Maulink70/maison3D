<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Appartement Diolly 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Vue 3D de l'appartement"></canvas>

  <header class="bar">
    <div class="brand"><strong>Appartement Diolly</strong><span>2 niveaux · échelle 1:1 en mètres</span></div>
    <div class="seg" role="group" aria-label="Ce que l’on fait">
      <button id="mo-visite" aria-pressed="true">Visite</button>
      <button id="mo-editer" aria-pressed="false">Éditer</button>
    </div>
    <div class="seg" role="group" aria-label="Vue">
      <button id="m-orbit" aria-pressed="true">Maquette</button>
      <button id="m-walk" aria-pressed="false">1re personne</button>
    </div>
    <div class="seg" role="group" aria-label="Niveau">
      <button id="l-all" aria-pressed="true">Tout</button>
      <button id="l-rez" aria-pressed="false">Rez</button>
      <button id="l-etage" aria-pressed="false">Étage</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="portes" aria-pressed="false">Tout ouvrir</button>
    <button class="btn" id="toggle-panel" aria-expanded="true" hidden>Meubles</button>
  </header>

  <aside id="panel" aria-label="Mobilier" hidden>
    <section class="sec" id="sel" hidden>
      <div class="eyebrow" id="sel-cat">Mobilier</div>
      <h2 id="sel-name">—</h2>
      <div class="dims" id="sel-dims"></div>
      <div class="tools">
        <button class="btn primary wide" id="t-move">Déplacer</button>
        <button class="btn" id="t-rotl">↺ Tourner 90°</button>
        <button class="btn" id="t-rotr">↻ Tourner 90°</button>
        <div class="anglerow"><label for="t-angle">Angle</label><input type="range" id="t-angle" min="-180" max="180" step="1" value="0"><input type="number" id="t-angle-num" min="-180" max="180" step="1" value="0" inputmode="decimal" aria-label="Angle en degrés"><span>°</span></div>
        <button class="btn wide" id="t-porte" hidden>Ouvrir la porte</button>
        <div class="colorrow"><label for="t-color">Couleur</label><input type="color" id="t-color" value="#ffffff"><button class="btn" id="t-color-clear">Origine</button></div>
        <button class="btn" id="t-hide">Masquer</button>
        <button class="btn" id="t-reset">Remettre en place</button>
        <button class="btn wide" id="t-close">Désélectionner</button>
      </div>
    </section>
    <div class="filtres">
      <div class="seg" role="group" aria-label="Niveaux affichés dans la liste">
        <button id="f-tout" aria-pressed="true">Tout</button>
        <button id="f-rez" aria-pressed="false">Rez</button>
        <button id="f-etage" aria-pressed="false">Étage</button>
      </div>
      <input type="search" id="f-texte" placeholder="Rechercher un meuble…" aria-label="Rechercher un meuble" autocomplete="off">
    </div>
    <div class="list" id="list"><div class="attente">Chargement des meubles…</div></div>
    <div class="foot">
      <small id="save-state">Les changements restent dans ce navigateur.</small>
      <button class="btn danger" id="reset-all">Tout réinitialiser</button>
    </div>
  </aside>

  <div id="pad" hidden aria-label="Déplacement">
    <button class="up" data-k="fwd" aria-label="Avancer">▲</button>
    <button data-k="left" aria-label="Aller à gauche">◀</button>
    <button data-k="back" aria-label="Reculer">▼</button>
    <button data-k="right" aria-label="Aller à droite">▶</button>
  </div>
  <div id="hint"></div>
  <div id="charge" role="status" hidden>Meubles en cours de chargement <span class="num" id="charge-pct">0 %</span></div>
  <div id="loading"><div><span>Chargement de la maquette…</span><span class="meter"><i id="bar"></i></span><span class="num" id="pct">0 %</span></div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
